name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Until the package is on npm, the README installs the `npm pack` tarball
  # attached to the GitHub release. Check that a packed tarball installs
  # with npx and answers an MCP initialize request.
  npx-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Pack
        run: |
          npm ci
          npm pack

      - name: Run the tarball with npx and initialize
        run: |
          cd "$RUNNER_TEMP"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 600 npx -y --package="$(ls "$GITHUB_WORKSPACE"/mcp-server-jma-*.tgz)" mcp-server-jma | tee out.txt
          grep -q '"name":"mcp-server-jma"' out.txt

  # On a v* tag, attach the `npm pack` tarball to the GitHub release so it
  # can be installed with `npx --package=<url>` before the npm publish.
  release-tarball:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, npx-tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Pack and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm pack
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See README.md."
          gh release upload "$GITHUB_REF_NAME" mcp-server-jma-*.tgz --clobber
